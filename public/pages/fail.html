<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả thanh toán</title>
  <style>
    body { margin: 0; background: #f5f5f5; font-family: system-ui, sans-serif; color: #222; }
    main { max-width: 560px; margin: 12vh auto; padding: 32px; background: white; border-radius: 12px; }
    h1 { font-size: 26px; } p { line-height: 1.6; } button, a { display: inline-block; margin: 12px 12px 0 0; }
    button { padding: 10px 16px; cursor: pointer; } a { color: #222; }
  </style>
  <script src="/js/payment-result.js" defer></script>
</head>
<body>
  <main aria-live="polite">
    <h1 id="payment-title">Đang kiểm tra thanh toán</h1>
    <p id="payment-message">Vui lòng chờ xác nhận từ hệ thống.</p>
    <p id="payment-order"></p>
    <button id="payment-refresh" type="button">Kiểm tra lại</button>
    <a href="/account">Xem đơn hàng</a>
    <a href="/login" id="payment-login" hidden>Đăng nhập</a>
  </main>
</body>
</html>
