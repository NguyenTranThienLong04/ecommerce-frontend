<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/chat-sync.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
<script src="/vendor/dompurify.js"></script>
<script src="/js/safe-html.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cửa hàng · Karma Club</title>

<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/index.css">

<link rel="stylesheet" href="/css/chat.css">
<script src="/js/ui.js" defer></script>
<link rel="stylesheet" href="/css/notifications.css">
</head>

<body>
<a class="skip-link" href="#content">Đến nội dung chính</a>

<div id="main">

<div id="header-container"></div>

<main id="content" tabindex="-1">

<section class="products">

<div class="products__header">

<span class="eyebrow">The everyday collection</span><h1 class="products__title">Cửa hàng</h1><p class="section-description">Chọn phong cách. Tìm đúng kích thước.</p>

<div class="shop-filter">

<div class="filter-left">

<div class="filter-item">
<label for="filter-price">Khoảng giá</label>
<select id="filter-price">
<option value="">Lọc giá</option>
<option value="0-200">0 - 200k</option>
<option value="200-400">200k - 400k</option>
<option value="400-600">400k - 600k</option>
<option value="600+">600k+</option>
</select>
</div>

<div class="filter-item">
<label for="filter-category">Danh mục</label>
<select id="filter-category">
<option value="">Loại</option>
</select>
</div>

<div class="filter-item">
<label for="filter-size">Kích thước</label>
<select id="filter-size">
<option value="">Kích thước</option>
</select>
</div>

<div class="filter-item">
<label for="filter-color">Màu sắc</label>
<select id="filter-color">
<option value="">Màu sắc</option>
</select>
</div>

</div>

<div class="filter-right">

<div><label class="filter-sort-label" for="filter-sort">Sắp xếp</label><select id="filter-sort">
<option value="">Thứ tự</option>
<option value="price_asc">Giá tăng</option>
<option value="price_desc">Giá giảm</option>
</select>
</div>
<button id="reset-filters" class="reset-filter-btn">
Xóa lọc
</button>
</div>

</div>

</div>

<div class="products__list" id="products-list" aria-live="polite"></div>

<div class="pagination" id="pagination"></div>

</section>

</main>

<div id="footer-container"></div>

</div>

<script>

fetch('/pages/header.html')
.then(res=>res.text())
.then(html=>{
document.getElementById('header-container').innerHTML=html
})

fetch('/pages/footer.html')
.then(res=>res.text())
.then(html=>{
document.getElementById('footer-container').innerHTML=html
})

</script>

<script src="../js/header.js"></script>
<script src="../js/shop.js"></script>
<script src="/vendor/socket.io.min.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/chat-widget.js"></script>

</body>
</html>
