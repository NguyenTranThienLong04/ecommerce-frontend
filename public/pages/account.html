<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/payment-create.js"></script>
<script src="/js/chat-sync.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
<script src="/vendor/dompurify.js"></script>
<script src="/js/safe-html.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tài khoản · Karma Club</title>

<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/account.css">

<link rel="stylesheet" href="/css/chat.css">
<script src="/js/ui.js" defer></script>
<link rel="stylesheet" href="/css/notifications.css">
</head>

<body>
<a class="skip-link" href="#main-content">Đến nội dung chính</a>

<div id="main">

<div id="header-container"></div>

<main class="account-page" id="main-content" tabindex="-1">

<div class="account-sidebar">

<div class="user-info">
<img id="user-avatar" src="/assets/images/avatar.svg" width="64" height="64" alt="">
<p id="sidebar-name">User</p>
</div>

<ul>
<li class="active" data-tab="dashboard">Thông tin tài khoản</li>
<li data-tab="orders">Đơn hàng</li>
<li data-tab="address">Sổ địa chỉ</li>
<li data-tab="password">Đổi mật khẩu</li>
<li id="logout-btn">Thoát</li>
</ul>

</div>

<div class="account-content">

<!-- DASHBOARD -->

<div class="tab active" id="dashboard">

<h2>Thông tin tài khoản</h2>

<p id="hello-user"></p>

<div class="account-box">
<p><b>Tên:</b> <span id="account-name"></span></p>
<p><b>Email:</b> <span id="account-email"></span></p>
<p><b>Điểm tích lũy:</b> <span id="loyalty"></span></p>
</div>

</div>


<!-- ORDERS -->

<div class="tab" id="orders">

<h2>Lịch sử đơn hàng</h2>

<div class="table-scroll" role="region" aria-label="Lịch sử đơn hàng" tabindex="0"><table class="order-table">

<thead>
<tr>
<th scope="col">Mã đơn</th>
<th scope="col">Ngày</th>
<th scope="col">Tổng tiền</th>
<th scope="col">Trạng thái</th>
<th scope="col"></th>
</tr>
</thead>

<tbody id="order-list"></tbody>

</table></div>

</div>


<!-- ADDRESS -->

<div class="tab" id="address">

<h2>Sổ địa chỉ</h2>

<div id="address-list" class="address-list"></div>

<button class="btn" id="add-address-btn">
<span aria-hidden="true">+</span> Thêm địa chỉ
</button>

</div>


<!-- ADDRESS MODAL -->

<div id="address-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

<div class="modal-content">

<h3 id="modal-title">Thêm địa chỉ</h3>

<label for="receiverName">Tên người nhận</label><input id="receiverName" placeholder="Tên người nhận">
<label for="phone">Số điện thoại</label><input id="phone" placeholder="Số điện thoại">
<label for="addressLine">Địa chỉ</label><input id="addressLine" placeholder="Địa chỉ">
<label for="ward">Phường/Xã</label><input id="ward" placeholder="Phường/Xã">
<label for="district">Quận/Huyện</label><input id="district" placeholder="Quận/Huyện">
<label for="city">Tỉnh/Thành</label><input id="city" placeholder="Tỉnh/Thành">

<div class="modal-actions">
<button id="save-address" class="btn">Lưu</button>
<button id="cancel-address" class="btn-outline">Hủy</button>
</div>

</div>

</div>


<!-- PASSWORD -->

<div class="tab" id="password">

<h2>Đổi mật khẩu</h2>

<form autocomplete="off">

<label for="account-password-0">Mật khẩu cũ</label><input id="account-password-0" type="password" placeholder="Mật khẩu cũ" autocomplete="current-password">
<label for="account-password-1">Mật khẩu mới</label><input id="account-password-1" type="password" placeholder="Mật khẩu mới" autocomplete="new-password">
<label for="account-password-2">Xác nhận mật khẩu</label><input id="account-password-2" type="password" placeholder="Xác nhận mật khẩu" autocomplete="new-password">

<button class="btn">Cập nhật</button>

</form>

</div>

</div>

</main>

<div id="footer-container"></div>

</div>

<script>

fetch('/pages/header.html')
.then(res => res.text())
.then(html => {
document.getElementById('header-container').innerHTML = html;
});

fetch('/pages/footer.html')
.then(res => res.text())
.then(html => {
document.getElementById('footer-container').innerHTML = html;
});

</script>

<script src="../js/header.js"></script>
<script src="../js/account.js"></script>
<script src="../js/account-address.js"></script>
<script src="../js/account-orders.js"></script>
<script src="/vendor/socket.io.min.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/chat-widget.js"></script>
</body>
</html>
