<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả thanh toán · Karma Club</title>
  <script src="/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/reliability.css">
  <link rel="stylesheet" href="/css/payment.css">
  <script src="/js/payment-result.js" defer></script>
</head>
<body>
  <main class="payment-card" aria-live="polite">
    <a class="payment-brand" href="/">KARMA CLUB®</a>
    <div class="payment-symbol" aria-hidden="true">↗</div>
    <span class="eyebrow">Trạng thái thanh toán</span>
    <h1 id="payment-title">Đang kiểm tra thanh toán</h1>
    <p id="payment-message">Vui lòng chờ xác nhận từ hệ thống.</p>
    <p id="payment-order"></p>
    <div class="payment-actions">
      <button id="payment-refresh" class="button-primary" type="button">Kiểm tra lại</button>
      <a href="/account" class="button-link">Xem đơn hàng</a>
      <a href="/login" id="payment-login" class="button-link" hidden>Đăng nhập</a>
    </div>
  </main>
</body>
</html>
