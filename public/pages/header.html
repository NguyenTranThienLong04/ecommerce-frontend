<header id="header">
  <button type="button" class="header__menu-toggle" aria-label="Mở menu" aria-expanded="false" aria-controls="store-navigation">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="header__logo">
    <a href="/" aria-label="Karma Club — Trang chủ">
      <img src="/assets/images/logokarmaclub.png" width="48" height="48" alt="">
      <span class="brand-wordmark">KARMA CLUB<small>EVERYDAY / YOUR WAY</small></span>
    </a>
  </div>
  <nav class="header__nav" id="store-navigation" aria-label="Điều hướng chính">
    <ul class="header__menu">
      <li class="header__menu-item"><a href="/">Trang chủ</a></li>
      <li class="header__menu-item"><a href="/shop">Cửa hàng</a></li>
    </ul>
  </nav>
  <div class="header__search-box" role="search">
    <label class="sr-only" for="search-input">Tìm sản phẩm</label>
    <input id="search-input" type="search" placeholder="Tìm sản phẩm..." autocomplete="off">
    <button id="search-btn" class="header__search-icon" type="button" aria-label="Tìm kiếm">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
    </button>
  </div>
  <div class="header__icons">
    <a href="/cart" class="header__cart" aria-label="Giỏ hàng">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
    </a>
    <a href="#" class="header__user-link" id="user-icon" aria-label="Tài khoản">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
    </a>
  </div>
  <div class="header__overlay" id="header-overlay" aria-hidden="true"></div>
</header>
