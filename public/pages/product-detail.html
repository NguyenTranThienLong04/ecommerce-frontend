<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/chat-sync.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
<script src="/vendor/dompurify.js"></script>
<script src="/js/safe-html.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm · Karma Club</title>

  <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
<link rel="stylesheet" href="/css/product-detail.css">
<link rel="stylesheet" href="/css/chat.css">
<script src="/js/ui.js" defer></script>
<link rel="stylesheet" href="/css/notifications.css">
</head>
<body>
<a class="skip-link" href="#main-content">Đến nội dung chính</a>

<div id="main">

  <div id="header-container"></div>

  <main class="product-container" id="main-content" tabindex="-1">

    <!-- LEFT -->
    <div class="gallery">
      <img alt="Ảnh sản phẩm" id="mainImage" class="main-image" />
      <div id="thumbnails" class="thumbnails"></div>
    </div>

    <!-- RIGHT -->
    <div class="info">
      <span class="eyebrow">Karma Club / Collection</span><h1 id="productName"></h1>
      <h2 id="productPrice"></h2>

      <div class="section">
        <p class="label">KÍCH THƯỚC</p>
        <div id="sizes" class="size-list"></div>
      </div>

      <div class="section">
  <p class="label">MÀU SẮC</p>
  <div id="colors" class="size-list"></div>
</div>

      <p id="variant-availability" role="status">Chọn kích thước và màu sắc để xem tình trạng sản phẩm.</p>
      <button id="addToCartBtn" class="add-cart">
        THÊM VÀO GIỎ
      </button>

      <div id="productDescription" class="product-description"></div>
    </div>

  </main>
<!-- ADD TO CART POPUP -->
<div id="cartPopup" class="cart-popup hidden" role="dialog" aria-modal="true" aria-label="Đã thêm vào giỏ hàng">
  <div class="cart-popup-content">

    <div class="popup-header">
      <span>✔ THÊM VÀO GIỎ THÀNH CÔNG</span>
      <button type="button" aria-label="Đóng thông báo" onclick="closePopup()">✕</button>
    </div>

    <div class="popup-body">
      <img alt="Sản phẩm vừa thêm vào giỏ" id="popupImage" />
      <div>
        <h3 id="popupName"></h3>
        <p id="popupVariant"></p>
      </div>
    </div>

    <div class="popup-actions">
      <button class="continue-btn" onclick="continueShopping()">
        Tiếp tục mua sắm
      </button>

      <button class="view-cart-btn" onclick="goToCart()">
        Xem giỏ hàng
      </button>
    </div>

  </div>
</div>
  <div id="footer-container"></div>
</div>
  <script>
    // JS fetch header và chèn vào DOM
    fetch('/pages/header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header-container').innerHTML = html;
      });

    fetch('/pages/footer.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer-container').innerHTML = html;
      });
  </script>
  <script src="../js/header.js"></script>
<script src="/js/product-detail.js"></script>
<script src="/vendor/socket.io.min.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/chat-widget.js"></script>
</body>
</html>
