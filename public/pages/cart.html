<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/chat-sync.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
<script src="/vendor/dompurify.js"></script>
<script src="/js/safe-html.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng · Karma Club</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">

<link rel="stylesheet" href="/css/chat.css">
<script src="/js/ui.js" defer></script>
<link rel="stylesheet" href="/css/cart.css">
<link rel="stylesheet" href="/css/notifications.css">
</head>
<body>
<a class="skip-link" href="#main-content">Đến nội dung chính</a>
  <div id="main">
<div id="header-container"></div>
<main class="cart-container" id="main-content" tabindex="-1">

  <div class="page-intro"><span class="eyebrow">Your selection</span><h1>Giỏ hàng của bạn</h1><p>Kiểm tra sản phẩm và số lượng trước khi thanh toán.</p></div>

  <div class="cart-table">

    <div class="cart-header">
      <div>Sản phẩm</div>
      <div>Số lượng</div>
      <div>Tổng tiền</div>
      <div>Xóa</div>
    </div>

    <div class="cart-items"></div>

  </div>

  <div class="cart-summary">
    <h3>Tổng cộng:</h3>
    <h2 id="cartTotal">0 đ</h2>
    <button class="checkout-btn" onclick="goCheckout()">Thanh toán</button>
  </div>

</main>
<div id="footer-container"></div>
</div>

 <script>
    // JS fetch header và chèn vào DOM
    fetch('/pages/header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header-container').innerHTML = html;
      });

     fetch('/pages/footer.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer-container').innerHTML = html;
      });

  </script>
  <script src="../js/header.js"></script>
<script src="../js/cart.js"></script>
<script src="/vendor/socket.io.min.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/chat-widget.js"></script>
</body>
</html>
