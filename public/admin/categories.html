<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
<script src="/vendor/dompurify.js"></script>
<script src="/js/safe-html.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh mục · Karma Club Admin</title>
  <link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/admin/css/admin.css">
<script src="/js/ui.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">Đến nội dung chính</a>

<div id="slidebar-container"></div>
<div class="content" id="main-content" role="main" tabindex="-1"><header class="admin-topbar"><span>WORKSPACE / KARMA CLUB</span><a href="/">Xem cửa hàng ↗</a></header>
  <div class="page-intro"><h1>Danh mục</h1><p>Sắp xếp sản phẩm theo từng nhóm.</p></div>

  <section class="admin-form"><h3>Thông tin danh mục</h3><div class="toolbar">
  <div class="form-field"><label for="categoryName">Tên danh mục</label><input type="text" id="categoryName" placeholder="Tên danh mục"></div>
  <button class="button-primary" onclick="addCategory()">Thêm</button></div></section>



  <div class="table-scroll" role="region" aria-label="Bảng danh mục" tabindex="0"><table>
    <thead>
      <tr>
        <th scope="col">Tên danh mục</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody id="categoryTable"></tbody>
  </table></div>
</div>

 <script>

 fetch('/admin/slidebar.html')
  .then(res => res.text())
  .then(html => {
    // 1. Chèn sidebar vào trước
    document.getElementById('slidebar-container').innerHTML = html;

    // 2. Sau đó mới chạy code hiển thị email
    const adminUser = Api.stored("adminUser");
    const adminInfoElem = document.getElementById("adminInfo");

    if (adminUser && adminInfoElem) {
      adminInfoElem.textContent = "Xin chào: ";
      const email = document.createElement("b");
      email.textContent = adminUser.email;
      adminInfoElem.appendChild(email);
    }
  });
</script>
<script src="/admin/js/admin-auth.js"></script>
<script src="/admin/js/categories.js"></script>
</body>
</html>
