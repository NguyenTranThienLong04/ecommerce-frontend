<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/chat-sync.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
<script src="/vendor/dompurify.js"></script>
<script src="/js/safe-html.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm · Karma Club Admin</title>
  <link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/admin/css/admin.css">
  <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
<script src="/js/ui.js" defer></script>
<link rel="stylesheet" href="/css/notifications.css">
</head>
<body>
<a class="skip-link" href="#main-content">Đến nội dung chính</a>

<div id="slidebar-container"></div>

<div class="content" id="main-content" role="main" tabindex="-1"><header class="admin-topbar"><span>WORKSPACE / KARMA CLUB</span><a href="/">Xem cửa hàng ↗</a></header>

  <div class="page-intro"><h1>Sản phẩm</h1><p>Quản lý thiết kế, hình ảnh và thông tin sản phẩm.</p></div>

<div class="toolbar">
  <div class="form-field"><label for="searchInput">Tìm sản phẩm</label><input type="text" id="searchInput" placeholder="Search product..."></div>
  <button onclick="searchProducts()">Tìm kiếm</button></div>

  <section class="admin-form form-grid"><h3>Thông tin sản phẩm</h3>

  <div class="form-field"><label for="productName">Tên sản phẩm</label><input type="text" id="productName" placeholder="Tên sản phẩm"></div>

  <div class="form-field full-width"><label for="description">Mô tả sản phẩm</label><textarea id="description"></textarea></div>

  <div class="form-field"><label for="categorySelect">Danh mục</label><select id="categorySelect"></select></div>
  <h4>Tags</h4><div class="tag-options full-width">

<label>
<input type="checkbox" class="tag-checkbox" value="PCS">
PCS
</label>

<label>
<input type="checkbox" class="tag-checkbox" value="NEW">
NEW
</label>

<label>
<input type="checkbox" class="tag-checkbox" value="COLLAB">
COLLAB
</label>

<label>
<input type="checkbox" class="tag-checkbox" value="SALE">
SALE
</label>

<label>
<input type="checkbox" class="tag-checkbox" value="NEW ARRIVAL">
NEW ARRIVAL
</label>

</div>

<div class="form-field"><label for="customTags">Tags tùy chỉnh</label><input
type="text"
id="customTags"
placeholder="Custom tags: RESTOCK, PREORDER"
/></div>

  <div class="form-field"><label for="productImages">Ảnh sản phẩm (1–5 ảnh)</label><input type="file" id="productImages" multiple accept="image/*"></div>
  <small>Chọn từ 1 - 5 ảnh</small>

  <div class="form-actions full-width"><button class="button-primary" onclick="addProduct()">Lưu sản phẩm</button></div></section>



  <div class="table-scroll" role="region" aria-label="Bảng sản phẩm" tabindex="0"><table>
    <thead>
      <tr>
        <th scope="col">Image</th>
        <th scope="col">Tên sản phẩm</th>
        <th scope="col">Mô tả</th>
        <th scope="col">Giá thấp nhất</th>
        <th scope="col">Tổng stock</th>
        <th scope="col">Tags</th>
        <th scope="col">Action</th>
      </tr>
    </thead>

    <tbody id="productTable"></tbody>
  </table></div>

  <!-- PAGINATION -->
  <div class="pagination-controls">
    <button onclick="prevPage()">Prev</button>
    <span id="pageInfo"></span>
    <button onclick="nextPage()">Next</button>
  </div>

</div>
<script>

 fetch('/admin/slidebar.html')
  .then(res => res.text())
  .then(html => {
    // 1. Chèn sidebar vào trước
    document.getElementById('slidebar-container').innerHTML = html;

    // 2. Sau đó mới chạy code hiển thị email
    const adminUser = Api.stored("adminUser");
    const adminInfoElem = document.getElementById("adminInfo");

    if (adminUser && adminInfoElem) {
      adminInfoElem.textContent = "Xin chào: ";
      const email = document.createElement("b");
      email.textContent = adminUser.email;
      adminInfoElem.appendChild(email);
    }
  });
</script>
<script>
let editor;

ClassicEditor
  .create(document.querySelector('#description'))
  .then(newEditor => {
    editor = newEditor;
  });
</script>

<script src="/admin/js/admin-auth.js"></script>
<script src="/admin/js/products.js"></script>

<script src="/vendor/socket.io.min.js"></script>
<script src="/js/notifications.js"></script>
</body>
</html>
