<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
<script src="/vendor/dompurify.js"></script>
<script src="/js/safe-html.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khách hàng · Karma Club Admin</title>
  <link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/admin/css/users.css">
<script src="/js/ui.js" defer></script>
</head>

<body>
<a class="skip-link" href="#main-content">Đến nội dung chính</a>

<div id="slidebar-container"></div>

<div class="content" id="main-content" role="main" tabindex="-1"><header class="admin-topbar"><span>WORKSPACE / KARMA CLUB</span><a href="/">Xem cửa hàng ↗</a></header>

  <div class="page-intro"><h1>Khách hàng</h1><p>Thông tin tài khoản và phân quyền người dùng.</p></div>

  <div class="table-scroll" role="region" aria-label="Bảng khách hàng" tabindex="0"><table class="admin-table">

    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Email</th>
        <th scope="col">Phone</th>
        <th scope="col">Role</th>
        <th scope="col">Action</th>
      </tr>
    </thead>

    <tbody id="userTable">
    </tbody>

  </table></div>

</div>

<script src="/admin/js/admin-auth.js"></script>
<script src="/admin/js/users.js"></script>

<script>

fetch('/admin/slidebar.html')
.then(res => res.text())
.then(html => {

  document.getElementById('slidebar-container').innerHTML = html;

  const adminUser = Api.stored("adminUser");
  const adminInfoElem = document.getElementById("adminInfo");

  if (adminUser && adminInfoElem) {
    adminInfoElem.textContent = "Xin chào: ";
      const email = document.createElement("b");
      email.textContent = adminUser.email;
      adminInfoElem.appendChild(email);
  }

});

</script>

</body>
</html>
