<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/chat-sync.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
<script src="/vendor/dompurify.js"></script>
<script src="/js/safe-html.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đơn hàng · Karma Club Admin</title>

<link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/order.css">

<script src="/js/ui.js" defer></script>
<link rel="stylesheet" href="/css/notifications.css">
</head>

<body>
<a class="skip-link" href="#main-content">Đến nội dung chính</a>

<div id="slidebar-container"></div>

<div class="content" id="main-content" role="main" tabindex="-1"><header class="admin-topbar"><span>WORKSPACE / KARMA CLUB</span><a href="/">Xem cửa hàng ↗</a></header>

<div class="page-intro"><h1>Đơn hàng</h1><p>Theo dõi đơn hàng và cập nhật trạng thái xử lý.</p></div>

<div class="order-tools">

<div class="form-field"><label for="searchOrder">Tìm mã đơn hoặc email</label><input type="text" id="searchOrder" placeholder="Tìm mã đơn hoặc email"></div>

<div class="form-field"><label for="statusFilter">Trạng thái</label><select id="statusFilter">
<option value="">Tất cả trạng thái</option>
<option value="PENDING">PENDING</option>
<option value="CONFIRMED">CONFIRMED</option>
<option value="SHIPPING">SHIPPING</option>
<option value="DONE">DONE</option>
<option value="CANCEL">CANCEL</option>
</select></div>

</div>

<div class="order-stats">

<div class="stat">
<span id="totalOrders">0</span>
<p>Tổng đơn</p>
</div>

<div class="stat">
<span id="pendingOrders">0</span>
<p>Chờ xử lý</p>
</div>

<div class="stat">
<span id="shippingOrders">0</span>
<p>Đang giao</p>
</div>

<div class="stat">
<span id="doneOrders">0</span>
<p>Hoàn thành</p>
</div>

</div>

<div class="table-scroll" role="region" aria-label="Bảng đơn hàng" tabindex="0"><table class="order-table">

<thead>
<tr>
<th scope="col">Mã đơn</th>
<th scope="col">Khách hàng</th>
<th scope="col">Ngày</th>
<th scope="col">Tổng tiền</th>
<th scope="col">Trạng thái</th>
<th scope="col">Phương thức</th>
<th scope="col">Hành động</th>
</tr>
</thead>

<tbody id="order-list"></tbody>

</table></div>

<div id="pagination"></div>

</div>

<script src="/admin/js/admin-auth.js"></script>
<script src="/admin/js/order.js"></script>

<script>

fetch('/admin/slidebar.html')
.then(res => res.text())
.then(html => {

document.getElementById('slidebar-container').innerHTML = html;

const adminUser = Api.stored("adminUser");
const adminInfoElem = document.getElementById("adminInfo");

if (adminUser && adminInfoElem) {
adminInfoElem.textContent = "Xin chào: ";
      const email = document.createElement("b");
      email.textContent = adminUser.email;
      adminInfoElem.appendChild(email);
}

});

</script>

<script src="/vendor/socket.io.min.js"></script>
<script src="/js/notifications.js"></script>
</body>
</html>
