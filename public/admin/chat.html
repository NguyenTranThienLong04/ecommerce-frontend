<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/chat-sync.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin nhắn · Karma Club Admin</title>
  <link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/admin/css/chat.css">
<script src="/js/ui.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">Đến nội dung chính</a>

<div id="slidebar-container"></div>

<div class="content" id="main-content" role="main" tabindex="-1"><header class="admin-topbar"><span>WORKSPACE / KARMA CLUB</span><a href="/">Xem cửa hàng ↗</a></header>

  <div class="page-intro"><h1>Tin nhắn</h1><p>Kết nối và hỗ trợ khách hàng.</p></div>

  <div class="chat-container">

    <!-- danh sách user -->
    <div class="chat-users">
      <h3>Khách hàng</h3>
      <ul id="userList"></ul>
    </div>

    <!-- khung chat -->
    <div class="chat-box">

      <div id="chatHeader">
        Chọn khách hàng để chat
      </div>

      <div id="chatMessages" role="log" aria-label="Tin nhắn hội thoại"></div>

      <div class="chat-input">
        <input type="text" aria-label="Tin nhắn" id="messageInput" placeholder="Nhập tin nhắn...">
        <button id="sendBtn">Gửi</button>
      </div>

    </div>

  </div>

</div>

<script src="/vendor/socket.io.min.js"></script>
<script src="/admin/js/admin-auth.js"></script>
<script src="/admin/js/admin-chat.js"></script>

<script>

fetch('/admin/slidebar.html')
  .then(res => res.text())
  .then(html => {

    document.getElementById('slidebar-container').innerHTML = html;

    const adminUser = Api.stored("adminUser");
    const adminInfoElem = document.getElementById("adminInfo");

    if (adminUser && adminInfoElem) {
      adminInfoElem.textContent = "Xin chào: ";
      const email = document.createElement("b");
      email.textContent = adminUser.email;
      adminInfoElem.appendChild(email);
    }

  });

</script>

</body>
</html>
