<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/runtime-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/chat-sync.js"></script>
<link rel="stylesheet" href="/css/reliability.css">
<script src="/vendor/dompurify.js"></script>
<script src="/js/safe-html.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner · Karma Club Admin</title>
  <link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/admin/css/admin.css">
<script src="/js/ui.js" defer></script>
<link rel="stylesheet" href="/css/notifications.css">
</head>

<body>
<a class="skip-link" href="#main-content">Đến nội dung chính</a>

<div id="slidebar-container"></div>

<div class="content" id="main-content" role="main" tabindex="-1"><header class="admin-topbar"><span>WORKSPACE / KARMA CLUB</span><a href="/">Xem cửa hàng ↗</a></header>

<div class="page-intro"><h1>Banner</h1><p>Quản lý hình ảnh nổi bật trên cửa hàng.</p></div>

<!-- ADD FORM -->
<div class="banner-form form-grid"><h3>Thêm banner</h3>

<div class="form-field"><label for="image">Ảnh banner</label><input type="file" id="image"></div>
<div class="form-field"><label for="title">Tiêu đề</label><input type="text" id="title" placeholder="Title"></div>
<div class="form-field"><label for="link">Liên kết</label><input type="text" id="link" placeholder="Link"></div>
<div class="form-field"><label for="order">Thứ tự hiển thị</label><input type="number" id="order" placeholder="Order"></div>

<div class="form-actions full-width"><button class="button-primary" onclick="addBanner()">Thêm banner</button></div>

</div>


<div class="table-scroll" role="region" aria-label="Bảng banner" tabindex="0"><table id="banner-table">

<thead>
<tr>
<th scope="col">Image</th>
<th scope="col">Title</th>
<th scope="col">Order</th>
<th scope="col">Status</th>
<th scope="col">Action</th>
</tr>
</thead>

<tbody></tbody>

</table></div>

</div>


<script src="/admin/js/admin-auth.js"></script>
<script src="/admin/js/banners.js"></script>

<script>
fetch('/admin/slidebar.html')
.then(res => res.text())
.then(html => {

document.getElementById('slidebar-container').innerHTML = html;

const adminUser = Api.stored("adminUser");
const adminInfoElem = document.getElementById("adminInfo");

if (adminUser && adminInfoElem) {
adminInfoElem.textContent = "Xin chào: ";
      const email = document.createElement("b");
      email.textContent = adminUser.email;
      adminInfoElem.appendChild(email);
}

});
</script>

<script src="/vendor/socket.io.min.js"></script>
<script src="/js/notifications.js"></script>
</body>
</html>
